name: CI-WORKFLOW

on:
  push:
    branches: master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buil-test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: npm install

      - name: Test
        run: npm test

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*

      - name: Deploy
        run: echo "my code is deployed"
